name: main
container: alpine:3.23

dependencies:
  - name: Java
    value: openjdk25-jdk
  - name: Maven
    value: maven
  - name: Node.js
    value: nodejs
  - name: npm
    value: npm

environment:
  - name: JAVA_HOME
    value: /usr/lib/jvm/java-25-openjdk

jobs:
  - job: Test
    steps:
      - name: Test
        run: make test
