# Tests run against a real PostgreSQL started by Quarkus Dev Services (Docker or Podman required).
# Flyway applies the migrations and Hibernate validates the schema, as in production.
quarkus.datasource.devservices.image-name=postgres:18
quarkus.oidc.enabled=false
cisys.session.invalidate-on-shutdown=false

# Statistics are recomputed on every request in tests so count changes are visible immediately.
cisys.stats.cache-seconds=0

# Retention is run directly by RetentionTest, never on a schedule.
quarkus.scheduler.enabled=false

# Tests share 127.0.0.1, so keep the anonymous limiter out of the way; PublicRateLimitTest lowers it.
cisys.public.rate-limit.requests=100000
