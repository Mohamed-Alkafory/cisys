quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:cisys;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=sa
# Tests use H2 with a Hibernate-generated schema; the Postgres migrations are not run here.
quarkus.flyway.migrate-at-start=false
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.oidc.enabled=false
cisys.session.invalidate-on-shutdown=false

# Statistics are recomputed on every request in tests so count changes are visible immediately.
cisys.stats.cache-seconds=0
