services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: cisys
      POSTGRES_USER: cisys
      POSTGRES_PASSWORD: cisys
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["cisys-db:/var/lib/postgresql/data"]
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports: ["127.0.0.1:8180:8080"]
    volumes:
      - ./contrib/keycloak/realm.json:/opt/keycloak/data/import/cisys-realm.json:ro
      - cisys-keycloak:/opt/keycloak/data
volumes:
  cisys-db:
  cisys-keycloak:
